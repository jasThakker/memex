# Fixture codebases for unit tests. Paths are relative to this file (DESIGN.md section 5).

[codebases.layered_app]            # generic layered web app, with layer and domain rules
root = "layered_app"
packages = ["app"]
exclude = ["**/tests/**", "app/migrations/**"]
docs = ["AGENTS.md", "docs/**/*.md"]
extractors = ["sqlalchemy"]

[codebases.layered_app.layers]
"routes" = "routes"
"services" = "services"
"repos" = "repos"
"db/models" = "db_models"
"schema" = "schema"

[codebases.layered_app.domains]
strip_prefixes = ["repository_"]
strip_suffixes = ["_services", "_service"]
singularize = true

[codebases.layered_app.doc_kinds]  # first matching glob wins
"AGENTS.md" = "agents"
"docs/decisions/**" = "adr"
"docs/**" = "guide"

[codebases.plainrepo]              # two packages, one under src/; no rules, no extractors
root = "plainrepo"
packages = ["src/toolkit", "reporter"]
docs = ["README.md"]               # no doc_kinds: every Doc gets kind "doc"
