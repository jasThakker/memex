# Local Neo4j for development. Tests do not use this; they start their own throwaway container.
# Data lives in the named volume, so it survives restarts. `docker compose down -v` wipes it.
services:
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt (driver connections)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memex-dev-password}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" || exit 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  neo4j_data:
