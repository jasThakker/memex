# Multi-hop evaluation questions for Mealie v3.30.0 (DESIGN.md section 14 format).
# Drafted by an agent on 2026-11-11 from grep, reading and ast scripts only (never from
# Memex), spot-checked, not hand-verified. Every answer was derived twice: an ast scan of
# every name reference with its enclosing function or class, then a grep -w pass whose
# extra hits were all comments, docstrings or strings inside already listed items.
# Paths are relative to vendor/mealie. Qualnames name methods as module.Class.method; a
# call inside a nested function counts for the enclosing function.

