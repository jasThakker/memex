      - mealie.routes.recipe.recipe_crud_routes.RecipeController._finish_recipe_from_web
      - mealie.routes.recipe.recipe_crud_routes.RecipeController.create_one
      - mealie.services.scraper.recipe_bulk_scraper.RecipeBulkScraperService.scrape
      - mealie.services.migrations._migration_base.BaseMigrator.import_recipes_to_database
      - mealie.services.recipe.recipe_service.RecipeService.create_from_mealie_export
      - mealie.services.recipe.recipe_service.RecipeService.create_from_zip
      - mealie.services.recipe.ai_recipe_service.AIRecipeService.create_from_ai
    docs: []
  evidence: "RecipeController._finish_recipe_from_web -> mealie/routes/recipe/recipe_crud_routes.py:405,414 (self.service is the RecipeService from BaseRecipeController.service, mealie/routes/recipe/_base.py:51-52); RecipeController.create_one -> mealie/routes/recipe/recipe_crud_routes.py:652,655; RecipeBulkScraperService.scrape -> mealie/services/scraper/recipe_bulk_scraper.py:82,111 (self.service: RecipeService injected at :24-27); BaseMigrator.import_recipes_to_database -> mealie/services/migrations/_migration_base.py:168,223 (self.recipe_service = RecipeService(...) at :80); RecipeService.create_from_mealie_export -> mealie/services/recipe/recipe_service.py:493,512; RecipeService.create_from_zip -> mealie/services/recipe/recipe_service.py:518,543; AIRecipeService.create_from_ai -> mealie/services/recipe/ai_recipe_service.py:32,60 (AIRecipeService subclasses RecipeService)"
  note: "Grepped every `create_one(` in mealie/ and kept only receivers that resolve to RecipeService. HttpRepo mixin and label service calls (controller_labels.py:59, seeders.py:96) are different methods. Direct callers only."

