      - mealie.routes.admin.admin_management_ai_providers
      - mealie.routes.admin.admin_debug
      - mealie.routes.groups.controller_group_ai_providers
      - mealie.services.scraper.scraper_strategies
      - mealie.services.parser_services.openai.parser
      - mealie.services.recipe.ai_recipe_service
    docs: []
  evidence: "admin_management_ai_providers -> mealie/routes/admin/admin_management_ai_providers.py:54,59,64; admin_debug -> mealie/routes/admin/admin_debug.py:38; controller_group_ai_providers -> mealie/routes/groups/controller_group_ai_providers.py:64,94,113; scraper_strategies (RecipeScraperOpenAI.build_context, RecipeScraperOpenAITranscription.parse) -> mealie/services/scraper/scraper_strategies.py:378,414; openai parser (OpenAIParser._parse) -> mealie/services/parser_services/openai/parser.py:160; ai_recipe_service (AIRecipeService.build_recipe) -> mealie/services/recipe/ai_recipe_service.py:89; OpenAIService itself -> mealie/services/openai/openai.py:140"
