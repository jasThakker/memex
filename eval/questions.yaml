# Evaluation questions for Mealie v3.30.0 (DESIGN.md section 14).
# Drafted in Phase 1 by the built-in Explore agent before any Memex tools existed.
# Every item was checked to exist and exhaustive answers were re-grepped by Claude;
# q02, q08, q10, q11 and q12 were then verified by hand (2026-11-05).
# Paths are relative to vendor/mealie. Doc references are path#Heading, using the
# heading's plain text (Markdown links reduced to their visible text).

- id: q01
  category: locate
  question: "Where is the interface for ingredient parsers defined, and which concrete parser classes implement it?"
  expected:
    symbols:
      - mealie.services.parser_services._base.ABCIngredientParser
      - mealie.services.parser_services.ingredient_parser.BruteForceParser
      - mealie.services.parser_services.ingredient_parser.NLPParser
      - mealie.services.parser_services.openai.parser.OpenAIParser
    docs: []
  evidence: "ABCIngredientParser -> mealie/services/parser_services/_base.py:130; BruteForceParser -> mealie/services/parser_services/ingredient_parser.py:36; NLPParser -> mealie/services/parser_services/ingredient_parser.py:98; OpenAIParser -> mealie/services/parser_services/openai/parser.py:20"
  note: "Grepped the whole backend for ABCIngredientParser; no other subclasses. parser_services/brute/ holds helpers, not a subclass."

- id: q02
  category: locate
  question: "In a controller that subclasses BaseUserController, where does `self.repos` come from, and what decides the group/household scope it is built with? Where does the admin controller change this?"
  expected:
    symbols:
      - mealie.routes._base.base_controllers._BaseController.repos
      - mealie.routes._base.base_controllers.BaseUserController.group_id
      - mealie.routes._base.base_controllers.BaseUserController.household_id
      - mealie.routes._base.base_controllers.BaseAdminController.repos
      - mealie.repos.repository_factory.AllRepositories
    docs: []
  evidence: "_BaseController.repos (lazily builds AllRepositories(self.session, group_id=self.group_id, household_id=self.household_id)) -> mealie/routes/_base/base_controllers.py:45-49; BaseUserController.group_id (returns self.user.group_id) -> mealie/routes/_base/base_controllers.py:148-150; BaseUserController.household_id -> mealie/routes/_base/base_controllers.py:152-154; BaseAdminController.repos (group_id=None, household_id=None) -> mealie/routes/_base/base_controllers.py:174-179; AllRepositories -> mealie/repos/repository_factory.py:254"
  note: "User comes from Depends(get_current_user) at base_controllers.py:138 (get_admin_user for admins at :172). Controllers build AllRepositories directly here, not via Depends(get_repositories) as AGENTS.md describes; get_repositories (mealie/repos/all_repositories.py:8) is a thin wrapper used e.g. by BasePublicHouseholdExploreController.cross_household_repos."

