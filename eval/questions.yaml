- id: q11
  category: check_change
  question: "I want to rename the AI provider field `base_url` (e.g. to `endpoint_url`). Which backend code is affected and which documented rules apply?"
  expected:
    symbols:
      - mealie.db.models.group.ai_providers.AIProvider
      - mealie.schema.group.ai_providers.AIProviderCreate
      - mealie.schema.group.ai_providers.AIProviderCreate.validate_as_none
      - mealie.routes.groups.controller_group_ai_providers.GroupAIProviderController.test_ai_provider
      - mealie.routes.groups.controller_group_ai_providers.GroupAIProviderController.test_saved_ai_provider
      - mealie.services.openai.openai.OpenAIService.get_client
    docs:
      - docs/docs/contributors/developers-guide/database-changes.md#Overview
      - docs/docs/contributors/developers-guide/database-changes.md#Using Alembic to generate upgrade script
      - AGENTS.md#Cross-Cutting Concerns
      - AGENTS.md#What to Review
      - docs/docs/contributors/developers-guide/code-contributions.md#We Use GitHub Flow, So All Code Changes Happen Through Pull Requests
  evidence: "AIProvider.base_url column -> mealie/db/models/group/ai_providers.py:78; AIProviderCreate.base_url (inherited by Save/Update/Out) -> mealie/schema/group/ai_providers.py:14; validate_as_none field_validator('base_url') -> mealie/schema/group/ai_providers.py:29-31; test_ai_provider copies base_url -> mealie/routes/groups/controller_group_ai_providers.py:57; test_saved_ai_provider override dict -> mealie/routes/groups/controller_group_ai_providers.py:86; OpenAIService.get_client passes provider.base_url -> mealie/services/openai/openai.py:171; database-changes Overview -> docs/docs/contributors/developers-guide/database-changes.md:7; Alembic/SQLite+Postgres review -> database-changes.md:12-15; codegen after schema change -> AGENTS.md:148-151; review checklist -> AGENTS.md:189-192,204-206; update docs when APIs change -> docs/docs/contributors/developers-guide/code-contributions.md:15"
  note: "Grepped `base_url` across mealie/; these are the only AI-provider hits. The existing alembic migration (2187537c52b8) and frontend types are out of scope but also affected. code-contributions.md item 5 added during hand verification."

- id: q12
  category: check_change
  question: "I want to add a new ingredient parsing strategy selectable from the API. Which code must change or is affected, and what do the docs tell me to do?"
  expected:
    symbols:
      - mealie.services.parser_services._base.ABCIngredientParser
      - mealie.schema.recipe.recipe_ingredient.RegisteredParser
      - mealie.services.parser_services.ingredient_parser.get_parser
      - mealie.routes.parser.ingredient_parser.IngredientParserController.parse_ingredient
      - mealie.routes.parser.ingredient_parser.IngredientParserController.parse_ingredients
    docs:
      - docs/docs/contributors/guides/ingredient-parser.md#Alternative Parsers
      - AGENTS.md#Cross-Cutting Concerns
  evidence: "ABCIngredientParser (abstract parse_one, parse) -> mealie/services/parser_services/_base.py:130,159-163; RegisteredParser enum (nlp/brute/openai) -> mealie/schema/recipe/recipe_ingredient.py:519-522; get_parser (special-cases openai, falls back to NLPParser) -> mealie/services/parser_services/ingredient_parser.py:318-329; parse_ingredient -> mealie/routes/parser/ingredient_parser.py:13-17; parse_ingredients -> mealie/routes/parser/ingredient_parser.py:19-22; Alternative Parsers doc -> docs/docs/contributors/guides/ingredient-parser.md:14; codegen after schema (enum) change -> AGENTS.md:148-151"
  note: "The module-level __registrar dict (ingredient_parser.py:312) is where a new parser is registered, but it was dropped from expected during hand verification: it is a variable, and the graph only has module, class and function nodes. get_parser reads it, so it stands in for it. get_parser has exactly two callers (the two route methods), which need no change. The ingredient-parser doc is partly stale: it calls ABCIngredientParser a 'single method interface' (it has two abstract methods), and 'Improving The CRF Parser' points to a crfpp folder that does not exist in v3.30.0."
