- id: q08
  category: layer_domain
  question: "AGENTS.md says repositories automatically filter by group/household. Which layer actually applies that scoping, which classes or methods do it, and which controller base deliberately bypasses it?"
  expected:
    symbols:
      - mealie.repos.repository_generic.RepositoryGeneric._filter_builder
      - mealie.repos.repository_generic.GroupRepositoryGeneric.__init__
      - mealie.repos.repository_generic.HouseholdRepositoryGeneric.__init__
      - mealie.routes._base.base_controllers.BaseAdminController.repos
    docs:
      - AGENTS.md#Cross-Cutting Concerns
  evidence: "RepositoryGeneric._filter_builder (adds group_id/household_id to filter_by) -> mealie/repos/repository_generic.py:92-100; GroupRepositoryGeneric.__init__ (raises if group_id NOT_SET) -> mealie/repos/repository_generic.py:493-505; HouseholdRepositoryGeneric.__init__ (requires group_id and household_id) -> mealie/repos/repository_generic.py:509-526; BaseAdminController.repos (group_id=None, household_id=None) -> mealie/routes/_base/base_controllers.py:174-179; doc rule -> AGENTS.md:146,151-154"
  note: "Answer layer: repos (mealie/repos). _filter_builder is used by get_all/get_one/page_all etc. (repository_generic.py:131,151,168-170,239,278,336). Side finding: RepositoryGeneric._query line 82 calls q.filter(...) without assigning the result (a no-op). Covers the generic mechanism only."

- id: q09
  category: doc_rules
  question: "What do the project docs say about how I must (and must not) obtain a database session in routes versus services/scripts?"
  expected:
    symbols:
      - mealie.db.db_setup.generate_session
      - mealie.db.db_setup.session_context
    docs:
      - AGENTS.md#Backend Architecture (mealie/)
      - AGENTS.md#Common Gotchas
  evidence: "AGENTS.md#Backend Architecture (mealie/) -> AGENTS.md:33-35 (Depends(generate_session) in routes; session_context() in services/scripts); AGENTS.md#Common Gotchas -> AGENTS.md:219 (don't create sessions manually); generate_session -> mealie/db/db_setup.py:80 (docstring: only use with Depends, leaks otherwise); session_context -> mealie/db/db_setup.py:64"
  note: "generate_session docstring (db_setup.py:85) says to use `with_session` instead, but no such function exists; the intended one is session_context. Contributors docs say nothing about sessions."

