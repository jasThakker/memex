# Eval settings (DESIGN.md section 14). Both conditions use the same values.
model = "claude-sonnet-5-5"
effort = "high"            # passed as --effort; pinned so the CLI default cannot drift
runs_per_condition = 3     # multi-hop eval: 3 runs per question and condition
max_budget_usd = 2.0       # per claude call; a call that hits it ends as an error
timeout_s = 900            # per claude call
codebase = "mealie"        # a codebase name from memex.toml
