[project]
name = "memex"
version = "0.1.0"
description = "Knowledge graph over Python codebases and their docs, served to agents through a read-only MCP server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "neo4j>=6.4.1",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.11",
    "testcontainers[neo4j]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memex"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["memex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not neo4j and not realrepo'"
markers = [
    "neo4j: needs Docker; runs against a throwaway Neo4j testcontainer",
    "realrepo: needs the benchmark repos fetched into vendor/",
]
